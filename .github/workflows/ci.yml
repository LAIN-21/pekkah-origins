name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Install and tests run pull-request code; none of it needs the git token.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: fractal workload tests
        run: |
          docker build -q -t pekkah/fractal:ci workloads/fractal
          docker run --rm --network none --entrypoint python pekkah/fractal:ci -m unittest discover -s tests -v
      - name: gitleaks
        run: pnpm secrets:scan
