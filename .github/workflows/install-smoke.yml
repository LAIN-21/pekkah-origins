name: install-smoke

# The one-line worker install on a fresh GitHub-hosted Ubuntu runner, against the hosted market
# (PLAN2 PR-18). Run it by hand, never during a paid run or a recording:
# Actions → install-smoke → Run workflow. It needs open join (OPEN_WORKER_JOIN=1) on the market
# and the two GHCR packages public.

on:
  workflow_dispatch:
    inputs:
      payout:
        description: Preprod payout address for the test worker (addr_test1…)
        required: true
        type: string
      market:
        description: The market to join
        default: https://146-190-188-100.sslip.io
        type: string

permissions:
  contents: read

concurrency:
  group: install-smoke
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET: ${{ inputs.market }}
      PAYOUT: ${{ inputs.payout }}
      # Pinned to this run's commit: raw.githubusercontent.com caches a branch for minutes.
      INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The public scenario quotes, before the worker joins
        run: pnpm --dir apps/worker exec tsx src/smoke-quotes.ts "$MARKET" | tee "$RUNNER_TEMP/before.json"

      - name: The one-line install
        run: curl -fsSL "$INSTALL_URL" | sudo sh -s -- --payout "$PAYOUT" --market "$MARKET" | tee "$RUNNER_TEMP/install.log"

      - name: Listed as joining, calibrated, not selling
        id: listed
        run: |
          id=$(sed -n 's/^  Listed as   \([^ ]*\).*/\1/p' "$RUNNER_TEMP/install.log")
          echo "Listed as: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          curl -fsS "$MARKET/api/workers" | jq -e --arg id "$id" '
            [.[] | select(.workerId == $id)] | length == 1 and (.[0] |
              (.workerId | startswith("joining-")) and .selling == false and
              .status == "online" and .calibration.fractal.verified == true)'
          curl -fsS "$MARKET/api/workers" | jq --arg id "$id" '.[] | select(.workerId == $id)
            | {workerId, status, selling, hardware, verified: .calibration.fractal.verified}'

      - name: The public scenario quotes are unchanged while it is connected
        run: |
          pnpm --dir apps/worker exec tsx src/smoke-quotes.ts "$MARKET" > "$RUNNER_TEMP/during.json"
          diff -u "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/during.json"
          echo "The three public quotes are identical (ids and times aside)."

      - name: Uninstall
        run: curl -fsSL "$INSTALL_URL" | sudo sh -s -- --uninstall

      - name: Gone from the market and from the machine
        env:
          ID: ${{ steps.listed.outputs.id }}
        run: |
          gone=0
          for _ in $(seq 1 15); do
            if curl -fsS "$MARKET/api/workers" | jq -e --arg id "$ID" 'all(.[]; .workerId != $id)' >/dev/null; then
              gone=1
              break
            fi
            sleep 2
          done
          [ "$gone" = 1 ] || { echo "$ID is still listed"; exit 1; }
          echo "$ID is gone from /api/workers"
          [ -z "$(docker ps -aq --filter name=pekkah-worker)" ]
          [ -z "$(docker ps -aq --filter label=pekkah.job)" ]
          [ ! -e /etc/pekkah ]
          [ ! -e /var/lib/pekkah ]
          [ -z "$(docker images -q --filter reference='ghcr.io/lain-21/pekkah-*')" ]
          echo "No container, env file, data directory or image is left."

      - name: Remove the worker if a step failed
        if: failure()
        run: curl -fsSL "$INSTALL_URL" | sudo sh -s -- --uninstall || true
