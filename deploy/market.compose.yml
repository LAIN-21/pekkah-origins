# Compose project pekkah-market, on the market droplet.
#   docker compose -p pekkah-market -f deploy/market.compose.yml --env-file /opt/pekkah/env/market.env up -d --build
# Caddy is the only service with published ports. Each service lists exactly the
# env names it uses (PLAN 5.5); the env file is never passed whole to a container.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-build-args: &build-args
  GIT_SHA: ${GIT_SHA:-unknown}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - market
    logging: *logging

  market:
    build:
      context: ..
      target: market
      args: *build-args
    image: pekkah/market:local
    restart: unless-stopped
    init: true
    environment:
      MARKET_PORT: ${MARKET_PORT:-8080}
      PUBLIC_URL: ${PUBLIC_URL}
      FACILITATOR_URL: ${FACILITATOR_URL:-http://facilitator:4022}
      FACILITATOR_TIMEOUT_MS: ${FACILITATOR_TIMEOUT_MS:-120000}
      PEKKAH_ASSET: ${PEKKAH_ASSET}
      L1_CONFIRMATIONS: ${L1_CONFIRMATIONS:-0}
      WORKER_TOKENS: ${WORKER_TOKENS}
      AGENT_TOKEN: ${AGENT_TOKEN}
      DEMO_TOKEN: ${DEMO_TOKEN}
      AGENT_URL: ${AGENT_URL:-http://agent:4100}
      DEMO_COOLDOWN_SEC: ${DEMO_COOLDOWN_SEC:-120}
      DEMO_DAILY_RUNS: ${DEMO_DAILY_RUNS:-40}
      DATA_DIR: ${DATA_DIR:-/var/lib/pekkah}
      PEKKAH_DEV_ROUTES: ${PEKKAH_DEV_ROUTES:-}
      SELLER_A_ADDRESS: ${SELLER_A_ADDRESS:-}
      SELLER_B_ADDRESS: ${SELLER_B_ADDRESS:-}
      SELLER_C_ADDRESS: ${SELLER_C_ADDRESS:-}
      SELLER_A_MNEMONIC: ${SELLER_A_MNEMONIC:-}
    volumes:
      - pekkah_data:/var/lib/pekkah
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MARKET_PORT||8080)+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  facilitator:
    build:
      context: ..
      target: facilitator
      args: *build-args
    image: pekkah/facilitator:local
    restart: unless-stopped
    init: true
    environment:
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID}
      BLOCKFROST_BASE_URL: ${BLOCKFROST_BASE_URL:-https://cardano-preprod.blockfrost.io/api/v0}
      FACILITATOR_HOST: ${FACILITATOR_HOST:-0.0.0.0}
      FACILITATOR_PORT: ${FACILITATOR_PORT:-4022}
      CONFIRMATION_TIMEOUT_MS: ${CONFIRMATION_TIMEOUT_MS:-75000}
      ACCEPT_MEMPOOL: ${ACCEPT_MEMPOOL:-false}
    logging: *logging

  agent:
    build:
      context: ..
      target: agent
      args: *build-args
    image: pekkah/agent:local
    restart: unless-stopped
    init: true
    environment:
      MARKET_URL: ${MARKET_URL:-http://market:8080}
      AGENT_TOKEN: ${AGENT_TOKEN}
      BUYER_MNEMONIC: ${BUYER_MNEMONIC}
      BUYER_ACCOUNT_INDEX: ${BUYER_ACCOUNT_INDEX:-0}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID}
      BLOCKFROST_BASE_URL: ${BLOCKFROST_BASE_URL:-https://cardano-preprod.blockfrost.io/api/v0}
      PEKKAH_ASSET: ${PEKKAH_ASSET}
      CAP_PER_PAYMENT_USD: ${CAP_PER_PAYMENT_USD:-0.10}
      CAP_RUN_USD: ${CAP_RUN_USD:-0.20}
      CAP_DAY_USD: ${CAP_DAY_USD:-5}
      AGENT_MODE: ${AGENT_MODE:-service}
      AGENT_PORT: ${AGENT_PORT:-4100}
    logging: *logging

volumes:
  pekkah_data:
  caddy_data:
  caddy_config:
